# Loaded only on this printer model: start.sh adds printer.rinkhals.<model code>.cfg
# when it exists, before printer.rinkhals.cfg, so printer.custom.cfg can still
# override anything here. Other models have no air filter or box fan, and a
# macro for a fan that does not exist only produces an error when it is used.

# Air filter and box circulation fan helpers for Kobra S1 and S1 Max
[gcode_macro SET_AIR_FILTER]
description: Set air filter fan speed (0.0 to 1.0)
gcode:
    {% set speed = params.SPEED|default(1.0)|float %}
    SET_FAN_SPEED FAN=air_filter_fan SPEED={speed}

[gcode_macro SET_BOX_FAN]
description: Set box circulation fan speed (0.0 to 1.0)
gcode:
    {% set speed = params.SPEED|default(1.0)|float %}
    SET_FAN_SPEED FAN=box_fan SPEED={speed}
