<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Browser</title>


<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}a:hover{color:inherit}
.ic{font-family:'Material Symbols Rounded';font-weight:normal;font-style:normal;line-height:1;letter-spacing:normal;white-space:nowrap;font-feature-settings:'liga'}
button,input{font:inherit;color:inherit;cursor:pointer}
</style>
</head>
<body>


<div style="width: 800px; height: 480px; box-sizing: border-box; background: #0d120e; color: #eef3ec; font-family: Inter, sans-serif; display: flex; flex-direction: column; overflow: hidden">
  <header style="height: 64px; flex-shrink: 0; box-sizing: border-box; padding: 0 12px 0 6px; display: flex; align-items: center; gap: 6px; border-bottom: 1px solid #1f2a21">
    <a href="Main.html" aria-label="Back to home" style="width: 48px; height: 48px; border-radius: 12px; display: flex; align-items: center; justify-content: center"><span class="ic" aria-hidden="true" style="font-size: 26px">arrow_back</span></a>
    <label for="url" style="flex-grow: 1; height: 44px; box-sizing: border-box; padding: 0 14px; border-radius: 12px; background: #161d17; border: 1px solid #243026; display: flex; align-items: center; gap: 10px">
      <span class="ic" aria-hidden="true" style="font-size: 18px; color: #4fb548">lock</span>
      <input id="url" type="text" value="klipper3d.org/Pressure_Advance.html" aria-label="Address" style="flex-grow: 1; border: none; outline: none; background: transparent; font-size: 15px; cursor: text">
    </label>
    <button type="button" aria-label="Reload" style="width: 48px; height: 48px; border-radius: 12px; border: none; background: transparent; display: flex; align-items: center; justify-content: center"><span class="ic" aria-hidden="true" style="font-size: 24px; color: #9aa79a">refresh</span></button>
    <button type="button" aria-label="Bookmarks" style="width: 48px; height: 48px; border-radius: 12px; border: none; background: transparent; display: flex; align-items: center; justify-content: center"><span class="ic" aria-hidden="true" style="font-size: 24px; color: #9aa79a">bookmarks</span></button>
  </header>
  <div style="height: 3px; background: #161d17"><div style="width: 40%; height: 3px; background: #4fb548"></div></div>
  <main style="flex-grow: 1; box-sizing: border-box; padding: 20px 64px; display: flex; flex-direction: column; gap: 12px; overflow: hidden">
    <div style="font-size: 13px; color: #9aa79a">klipper3d.org · Reader mode</div>
    <h1 style="margin: 0; font-size: 28px; line-height: 1.2; font-weight: 700">Pressure advance</h1>
    <p style="margin: 0; font-size: 17px; line-height: 1.6; color: #d6ded4">[ARTICLE TEXT — the reader shows the page's own paragraphs here, one column, large type.]</p>
  </main>
  <nav style="height: 52px; flex-shrink: 0; box-sizing: border-box; padding: 0 20px; border-top: 1px solid #1f2a21; display: flex; align-items: center; gap: 8px">
    <button type="button" aria-label="Page back" style="width: 44px; height: 44px; border-radius: 10px; border: none; background: transparent; display: flex; align-items: center; justify-content: center"><span class="ic" aria-hidden="true" style="font-size: 22px">chevron_left</span></button>
    <button type="button" aria-label="Page forward" style="width: 44px; height: 44px; border-radius: 10px; border: none; background: transparent; display: flex; align-items: center; justify-content: center"><span class="ic" aria-hidden="true" style="font-size: 22px; color: #5d6a5e">chevron_right</span></button>
    <div style="flex-grow: 1"></div>
    <button type="button" style="height: 40px; padding: 0 14px; border-radius: 10px; border: 1px solid #2a362b; background: transparent; font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 6px"><span class="ic" aria-hidden="true" style="font-size: 18px">text_fields</span>Text size</button>
  </nav>
</div>


</body>
</html>
