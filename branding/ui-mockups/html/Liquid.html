<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Liquid Plastic UI home</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,500,1,0" rel="stylesheet">
<style>
  /* Liquid Plastic: our take on the "liquid glass" look. Clear, curved panes that
     blur and tint what is behind them, lit from the top left, with a bright thin
     rim that fades around the edge. Capsules and circles, floating, no hard
     borders. It is only drawn once: the panes sit on a fixed wallpaper, so the
     printer shows them as part of the wallpaper image and only the icons, text and
     the touch areas are live (see branding/make-liquid-wallpaper.py). */
  html, body { margin: 0; background: #000; }
  .ic { font-family: 'Material Symbols Rounded'; font-weight: normal; font-style: normal; line-height: 1; letter-spacing: normal; white-space: nowrap; font-feature-settings: 'liga'; }
  button { font: inherit; color: inherit; border: 0; padding: 0; cursor: pointer; background: none; }
  #screen { width: 800px; height: 480px; position: relative; overflow: hidden; box-sizing: border-box; font-family: Inter, sans-serif; color: #fff;
    background: #05140b; }
  svg.world { position: absolute; left: 0; top: 0; }

  /* a pane of liquid glass */
  .lg { position: absolute; isolation: isolate;
    background:
      radial-gradient(70% 55% at 22% 8%, rgba(255,255,255,.34) 0%, rgba(255,255,255,0) 70%),
      linear-gradient(160deg, rgba(255,255,255,.20) 0%, rgba(255,255,255,.05) 45%, rgba(255,255,255,.12) 100%);
    backdrop-filter: blur(14px) saturate(1.9) brightness(1.12);
    -webkit-backdrop-filter: blur(14px) saturate(1.9) brightness(1.12);
    box-shadow:
      0 14px 28px rgba(0,0,0,.38),
      0 2px 6px rgba(0,0,0,.25),
      inset 0 0 22px rgba(255,255,255,.10),
      inset 0 1.5px 1px rgba(255,255,255,.55),
      inset 0 -1.5px 1px rgba(255,255,255,.22); }
  /* the rim: a thin edge that is bright where the light hits and fades elsewhere */
  .lg::before { content: ''; position: absolute; inset: 0; border-radius: inherit; padding: 1.6px; pointer-events: none;
    background: conic-gradient(from 215deg, rgba(255,255,255,.95), rgba(255,255,255,.08) 22%, rgba(255,255,255,.55) 50%, rgba(255,255,255,.06) 72%, rgba(255,255,255,.95));
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor;
    mask: linear-gradient(#000 0 0) content-box exclude, linear-gradient(#000 0 0); }
  .lg > * { position: relative; z-index: 1; }
  .tint { background:
      radial-gradient(70% 55% at 22% 8%, rgba(255,255,255,.55) 0%, rgba(255,255,255,0) 70%),
      linear-gradient(160deg, rgba(214,255,140,.95) 0%, rgba(150,225,100,.78) 100%) !important; }
  .warm { background:
      radial-gradient(70% 55% at 22% 8%, rgba(255,255,255,.45) 0%, rgba(255,255,255,0) 70%),
      linear-gradient(160deg, rgba(255,140,120,.85) 0%, rgba(235,70,55,.80) 100%) !important; }

  .orb { width: 58px; height: 58px; border-radius: 50%; top: 411px; display: grid; place-items: center; }
  .orb .ic { font-size: 29px; text-shadow: 0 1px 5px rgba(0,0,0,.35); }
</style>
</head>
<body>
<div id="screen">
  <!-- the world behind the glass: colour for the panes to bend and blur -->
  <svg class="world" width="800" height="480" viewBox="0 0 800 480" aria-hidden="true">
    <defs>
      <radialGradient id="lime" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#c8f56e"/><stop offset="1" stop-color="#c8f56e" stop-opacity="0"/></radialGradient>
      <radialGradient id="leaf" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#3fcf5c"/><stop offset="1" stop-color="#3fcf5c" stop-opacity="0"/></radialGradient>
      <radialGradient id="teal" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#27d6b0"/><stop offset="1" stop-color="#27d6b0" stop-opacity="0"/></radialGradient>
      <radialGradient id="deep" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#0f5a2a"/><stop offset="1" stop-color="#0f5a2a" stop-opacity="0"/></radialGradient>
      <linearGradient id="ribbon" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#e6ffa8" stop-opacity="0"/><stop offset=".5" stop-color="#e6ffa8" stop-opacity=".95"/><stop offset="1" stop-color="#e6ffa8" stop-opacity="0"/></linearGradient>
    </defs>
    <rect width="800" height="480" fill="#06170c"/>
    <circle cx="130" cy="90" r="210" fill="url(#leaf)" opacity=".85"/>
    <circle cx="640" cy="60" r="190" fill="url(#lime)" opacity=".75"/>
    <circle cx="420" cy="300" r="230" fill="url(#deep)" opacity=".9"/>
    <circle cx="720" cy="400" r="190" fill="url(#teal)" opacity=".7"/>
    <circle cx="60" cy="420" r="170" fill="url(#lime)" opacity=".55"/>
    <circle cx="330" cy="40" r="120" fill="url(#teal)" opacity=".45"/>
    <path d="M-40 380 C 150 260, 300 330, 470 230 S 720 70, 860 110" fill="none" stroke="url(#ribbon)" stroke-width="14" opacity=".55"/>
    <path d="M-40 430 C 170 320, 320 380, 480 280 S 730 110, 860 150" fill="none" stroke="url(#ribbon)" stroke-width="4" opacity=".8"/>
    <path d="M-40 460 C 190 390, 340 430, 500 330 S 740 170, 860 200" fill="none" stroke="url(#ribbon)" stroke-width="2" opacity=".6"/>
  </svg>

  <!-- taskbar: one capsule -->
  <div class="lg" style="left: 8px; right: 8px; top: 399px; height: 74px; border-radius: 37px"></div>

  <button class="lg orb" style="left: 16px" aria-label="Settings"><span class="ic">settings</span></button>
  <button class="lg orb" style="left: 88px" aria-label="App Store"><span class="ic">local_mall</span></button>
  <button class="lg orb" style="left: 160px" aria-label="Apps"><span class="ic">widgets</span></button>
  <button class="lg orb" style="left: 232px" aria-label="Web portal QR code"><span class="ic">qr_code_2</span></button>
  <button class="lg orb" style="left: 304px" aria-label="LemSearch"><span class="ic">search</span></button>
  <button class="lg orb warm" style="left: 376px" aria-label="Power"><span class="ic">power_settings_new</span></button>

  <!-- clock -->
  <div class="lg" style="left: 684px; top: 411px; width: 96px; height: 58px; border-radius: 29px; display: grid; place-items: center">
    <div style="text-align: center; line-height: 1.05">
      <div style="font-size: 22px; font-weight: 700; text-shadow: 0 1px 5px rgba(0,0,0,.35)">19:09</div>
      <div style="font-size: 11px; font-weight: 500; opacity: .9">11/11/2026</div>
    </div>
  </div>

  <!-- back -->
  <button class="lg" style="left: 14px; top: 14px; width: 60px; height: 60px; border-radius: 50%; display: grid; place-items: center" aria-label="Back">
    <span class="ic" style="font-size: 30px; text-shadow: 0 1px 5px rgba(0,0,0,.35)">undo</span>
  </button>

  <!-- tab: a capsule that hangs from the top edge -->
  <div class="lg" style="left: 236px; top: -34px; width: 328px; height: 124px; border-radius: 0 0 44px 44px">
    <div style="position: absolute; left: 0; right: 0; top: 44px; display: flex; justify-content: center; align-items: center; gap: 10px">
      <svg width="30" height="30" viewBox="0 0 30 30"><circle cx="15" cy="15" r="13" fill="#4fb548"/><circle cx="11" cy="12" r="2.4" fill="#fff"/><circle cx="19" cy="12" r="2.4" fill="#fff"/><path d="M8 19 C12 24 18 24 22 19" stroke="#0d3a14" stroke-width="2" fill="none" stroke-linecap="round"/></svg>
      <span style="font-size: 24px; font-weight: 700; text-shadow: 0 1px 6px rgba(0,0,0,.35)">Boomslang</span>
    </div>
    <div style="position: absolute; left: 0; right: 0; top: 83px; display: flex; justify-content: center; align-items: center; gap: 10px">
      <span style="font-size: 14px; opacity: .92">2611 5 Alpha</span>
      <span class="lg tint" style="position: relative; display: inline-grid; place-items: center; height: 26px; padding: 0 16px; border-radius: 13px; font-size: 13px; font-weight: 700; color: #0e3d14; box-shadow: 0 4px 10px rgba(0,0,0,.3), inset 0 1px 1px rgba(255,255,255,.7)">Update</span>
    </div>
  </div>

  <!-- tray -->
  <div class="lg" style="left: 696px; top: 14px; width: 90px; height: 90px; border-radius: 34px">
    <span class="ic" style="position: absolute; left: 20px; top: 18px; font-size: 24px">wifi</span>
    <span class="ic" style="position: absolute; left: 54px; top: 18px; font-size: 24px">swap_vert</span>
    <span class="ic" style="position: absolute; left: 20px; top: 54px; font-size: 24px">notifications</span>
    <span class="ic" style="position: absolute; left: 54px; top: 54px; font-size: 24px">print</span>
    <span class="lg warm" style="position: absolute; left: 38px; top: 52px; width: 18px; height: 18px; border-radius: 50%; display: grid; place-items: center; font-size: 11px; font-weight: 700">1</span>
  </div>
</div>
</body>
</html>
