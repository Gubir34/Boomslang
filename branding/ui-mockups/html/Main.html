<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Boomslang home</title>


<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}a:hover{color:inherit}
.ic{font-family:'Material Symbols Rounded';font-weight:normal;font-style:normal;line-height:1;letter-spacing:normal;white-space:nowrap;font-feature-settings:'liga'}
button{font:inherit;color:inherit;cursor:pointer}
</style>
</head>
<body>


<div style="width: 800px; height: 480px; box-sizing: border-box; background: #0d120e; color: #eef3ec; font-family: Inter, sans-serif; display: flex; flex-direction: column; overflow: hidden">
  <header style="height: 56px; flex-shrink: 0; box-sizing: border-box; padding: 0 20px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid #1f2a21">
    <img src="boomslang-logo.svg" alt="" style="width: 34px; height: 34px">
    <div style="font-size: 20px; font-weight: 700; letter-spacing: -0.01em">Boomslang</div>
    <div style="flex-grow: 1"></div>
    <div style="font-size: 14px; color: #9aa79a">Kobra S1 · 192.168.1.x</div>
    <div style="font-size: 14px; font-weight: 600; padding: 6px 10px; border-radius: 999px; background: rgba(79,181,72,0.16); color: #4fb548">v[VERSION]</div>
  </header>
  <main style="flex-grow: 1; box-sizing: border-box; padding: 16px 20px; display: flex; flex-direction: column; gap: 12px">
    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px">
      <a href="Apps.html" style="height: 148px; box-sizing: border-box; padding: 18px; border-radius: 16px; background: #161d17; border: 1px solid #243026; display: flex; flex-direction: column; gap: 10px">
        <span class="ic" aria-hidden="true" style="width: 48px; height: 48px; border-radius: 12px; background: rgba(79,181,72,0.16); color: #4fb548; font-size: 28px; display: flex; align-items: center; justify-content: center">apps</span>
        <span style="flex-grow: 1"></span>
        <span style="font-size: 19px; font-weight: 600">Apps</span>
        <span style="font-size: 13px; color: #9aa79a">Start, stop, configure</span>
      </a>
      <a href="FlatStore.html" style="height: 148px; box-sizing: border-box; padding: 18px; border-radius: 16px; background: #161d17; border: 1px solid #243026; display: flex; flex-direction: column; gap: 10px">
        <span class="ic" aria-hidden="true" style="width: 48px; height: 48px; border-radius: 12px; background: rgba(79,181,72,0.16); color: #4fb548; font-size: 28px; display: flex; align-items: center; justify-content: center">storefront</span>
        <span style="flex-grow: 1"></span>
        <span style="font-size: 19px; font-weight: 600">App Store</span>
        <span style="font-size: 13px; color: #9aa79a">Browse and install</span>
      </a>
      <a href="FlatUpdates.html" style="height: 148px; box-sizing: border-box; padding: 18px; border-radius: 16px; background: #161d17; border: 1px solid #243026; display: flex; flex-direction: column; gap: 10px">
        <span style="display: flex; justify-content: space-between; align-items: flex-start">
          <span class="ic" aria-hidden="true" style="width: 48px; height: 48px; border-radius: 12px; background: rgba(79,181,72,0.16); color: #4fb548; font-size: 28px; display: flex; align-items: center; justify-content: center">system_update</span>
          <span style="font-size: 12px; font-weight: 700; padding: 4px 8px; border-radius: 999px; background: #4fb548; color: #0d120e">NEW</span>
        </span>
        <span style="flex-grow: 1"></span>
        <span style="font-size: 19px; font-weight: 600">Updates</span>
        <span style="font-size: 13px; color: #9aa79a">Boomslang and firmware</span>
      </a>
      <a href="FlatPortal.html" style="height: 148px; box-sizing: border-box; padding: 18px; border-radius: 16px; background: #161d17; border: 1px solid #243026; display: flex; flex-direction: column; align-items: flex-start; gap: 10px; text-align: left">
        <span class="ic" aria-hidden="true" style="width: 48px; height: 48px; border-radius: 12px; background: #1f2a21; color: #c9ea7f; font-size: 28px; display: flex; align-items: center; justify-content: center">qr_code_2</span>
        <span style="flex-grow: 1"></span>
        <span style="font-size: 19px; font-weight: 600">Web portal</span>
        <span style="font-size: 13px; color: #9aa79a">Open on your phone</span>
      </a>
      <button type="button" style="height: 148px; box-sizing: border-box; padding: 18px; border-radius: 16px; background: #161d17; border: 1px solid #243026; display: flex; flex-direction: column; align-items: flex-start; gap: 10px; text-align: left">
        <span class="ic" aria-hidden="true" style="width: 48px; height: 48px; border-radius: 12px; background: #1f2a21; color: #c9ea7f; font-size: 28px; display: flex; align-items: center; justify-content: center">dashboard</span>
        <span style="flex-grow: 1"></span>
        <span style="font-size: 19px; font-weight: 600">Mainsail</span>
        <span style="font-size: 13px; color: #9aa79a">Klipper web interface</span>
      </button>
      <a href="FlatBrowser.html" style="height: 148px; box-sizing: border-box; padding: 18px; border-radius: 16px; background: #161d17; border: 1px solid #243026; display: flex; flex-direction: column; gap: 10px">
        <span class="ic" aria-hidden="true" style="width: 48px; height: 48px; border-radius: 12px; background: #1f2a21; color: #c9ea7f; font-size: 28px; display: flex; align-items: center; justify-content: center">public</span>
        <span style="flex-grow: 1"></span>
        <span style="font-size: 19px; font-weight: 600">Browser</span>
        <span style="font-size: 13px; color: #9aa79a">Reader-mode web</span>
      </a>
    </div>
    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px">
      <button type="button" style="height: 56px; border-radius: 14px; background: #121813; border: 1px solid #243026; display: flex; align-items: center; justify-content: center; gap: 10px; font-size: 16px; font-weight: 500">
        <span class="ic" aria-hidden="true" style="font-size: 22px; color: #9aa79a">restart_alt</span>Restart</button>
      <button type="button" style="height: 56px; border-radius: 14px; background: #121813; border: 1px solid #243026; display: flex; align-items: center; justify-content: center; gap: 10px; font-size: 16px; font-weight: 500">
        <span class="ic" aria-hidden="true" style="font-size: 22px; color: #9aa79a">power_settings_new</span>Reboot</button>
      <a href="FlatSettings.html" style="height: 56px; border-radius: 14px; background: #121813; border: 1px solid #3a2420; display: flex; align-items: center; justify-content: center; gap: 10px; font-size: 16px; font-weight: 500">
        <span class="ic" aria-hidden="true" style="font-size: 22px; color: #ff7a66">settings</span>Settings</a>
    </div>
  </main>
</div>


</body>
</html>
