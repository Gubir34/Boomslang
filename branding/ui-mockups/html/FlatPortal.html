<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Web portal</title>


<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}a:hover{color:inherit}
.ic{font-family:'Material Symbols Rounded';font-weight:normal;font-style:normal;line-height:1;letter-spacing:normal;white-space:nowrap;font-feature-settings:'liga'}
button,input{font:inherit;color:inherit;cursor:pointer}
</style>
</head>
<body>


<div style="width: 800px; height: 480px; box-sizing: border-box; background: #0d120e; color: #eef3ec; font-family: Inter, sans-serif; display: flex; flex-direction: column; overflow: hidden">
  <header style="height: 56px; flex-shrink: 0; box-sizing: border-box; padding: 0 12px 0 6px; display: flex; align-items: center; gap: 6px; border-bottom: 1px solid #1f2a21">
    <a href="Main.html" aria-label="Back" style="width: 48px; height: 48px; border-radius: 12px; display: flex; align-items: center; justify-content: center"><span class="ic" aria-hidden="true" style="font-size: 26px">arrow_back</span></a>
    <div style="font-size: 20px; font-weight: 700">Web portal</div>
    <div style="flex-grow: 1"></div>
    
  </header>
  <main style="flex-grow: 1; box-sizing: border-box; padding: 20px 28px; display: flex; align-items: center; gap: 32px">
    <div role="img" aria-label="QR code for the web portal" style="width: 300px; height: 300px; flex-shrink: 0; border-radius: 16px; background: #ffffff; color: #0d120e; display: flex; align-items: center; justify-content: center"><span class="ic" aria-hidden="true" style="font-size: 270px">qr_code_2</span></div>
    <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 14px">
      <span style="font-size: 26px; font-weight: 700; line-height: 1.2">Scan with your phone</span>
      <span style="font-size: 15px; line-height: 1.5; color: #9aa79a">Opens on any device on the same Wi-Fi.</span>
      <span style="font-size: 17px; font-weight: 600; padding: 10px 14px; border-radius: 10px; background: #161d17; border: 1px solid #243026; font-family: ui-monospace, monospace">http://192.168.1.x:8090</span>
      <div style="display: flex; gap: 8px">
        <button type="button" style="height: 44px; padding: 0 16px; border-radius: 999px; border: none; background: #4fb548; color: #0d120e; font-size: 15px; font-weight: 600">Web portal</button>
        <button type="button" style="height: 44px; padding: 0 16px; border-radius: 999px; border: 1px solid #2a362b; background: #161d17; font-size: 15px; font-weight: 500">Mainsail</button>
        <button type="button" style="height: 44px; padding: 0 16px; border-radius: 999px; border: 1px solid #2a362b; background: #161d17; font-size: 15px; font-weight: 500">Fluidd</button>
      </div>
    </div>
  </main>
</div>


</body>
</html>
