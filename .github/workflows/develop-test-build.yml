name: Develop Test Build

on:
  workflow_dispatch:
    inputs:
      version_bump:
        description: "Change significance (informational — used in release title)"
        required: true
        type: choice
        options:
          - patch
          - minor
          - major

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# Shares the release numbers with auto-release.yml: one build at a time
concurrency:
  group: auto-release
  cancel-in-progress: false

jobs:
  tests:
    uses: ./.github/workflows/tests.yml

  build_and_release:
    needs: tests
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Validate branch
        run: |
          if [ "${{ github.ref_name }}" != "develop" ]; then
            echo "This workflow must be run from the 'develop' branch (got '${{ github.ref_name }}')"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Calculate beta version
        id: version
        run: |
          # Next Beta in the shared numbering, e.g. 2611-4-beta = "2611 4 Beta"
          # (see build/release-name.sh)
          VERSION=$(git ls-remote --tags origin | sh build/release-name.sh next beta)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "title=$(sh build/release-name.sh title "$VERSION")" >> $GITHUB_OUTPUT
          echo "Calculated version: $VERSION  (bump type: ${{ inputs.version_bump }})"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build
        uses: docker/build-push-action@v7
        with:
          push: false
          context: .
          build-args: version=${{ steps.version.outputs.version }}
          outputs: type=local,dest=./build/dist
          cache-from: type=registry,ref=ghcr.io/gubir34/boomslang:buildcache

      - name: Check the update packages
        run: sh build/smoke-test-swu.sh build/dist "${{ steps.version.outputs.version }}"

      - name: Create beta release and tag
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ steps.version.outputs.version }}" \
            -m "Beta build ${{ steps.version.outputs.version }} (${{ inputs.version_bump }} change)"
          git push origin "${{ steps.version.outputs.version }}"

          gh release create "${{ steps.version.outputs.version }}" \
            --repo="$GITHUB_REPOSITORY" \
            --title="Boomslang ${{ steps.version.outputs.title }} (${{ inputs.version_bump }})" \
            --notes="Beta build from the \`develop\` branch — **for testing only, not for production use.**" \
            --prerelease \
            build/dist/*.swu \
            build/dist/*.zip
