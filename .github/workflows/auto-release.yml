name: Auto release on tag

on:
  push:
    tags:
      # Release tags only (YYYYMMDD_NN, optionally _test). A bare '*' meant any
      # stray tag published a draft release with all 12 SWU assets attached.
      - '20*'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:

    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
    - uses: actions/checkout@v7

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Login to GitHub Container Registry
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and export
      uses: docker/build-push-action@v7
      with:
        push: false
        context: .
        build-args: version=${{ github.ref_name }}
        outputs: type=local,dest=./build/dist
        cache-from: type=registry,ref=ghcr.io/gubir34/boomslang:buildcache
        cache-to: type=registry,ref=ghcr.io/gubir34/boomslang:buildcache,mode=max,ignore-error=true

    - name: Create release
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        tag: ${{ github.ref_name }}
      # Published, not a draft: the printer's updater (touch UI and web portal)
      # reads the public releases API, which never lists drafts. Tags with
      # "_test" are published as pre-releases, which the updater only shows
      # when test versions are enabled.
      run: |
        PRERELEASE=
        case "$tag" in *_test*|*beta*) PRERELEASE=--prerelease ;; esac
        gh release create "$tag" \
            --repo="$GITHUB_REPOSITORY" \
            --title="Boomslang ${tag}" \
            --generate-notes \
            $PRERELEASE \
            build/dist/*.swu \
            build/dist/*.zip
