name: Auto release on tag

on:
  # Forks don't run push-triggered workflows until enabled in the Actions
  # tab; a release can also be started by hand on a tag:
  #   gh workflow run auto-release.yml --ref <tag>
  workflow_dispatch:
  push:
    # Every push to master builds a new test release (YYYYMMDD_NN_test).
    # Documentation, branding and local firmware copies do not trigger one.
    branches:
      - master
    paths-ignore:
      - '**.md'
      - 'branding/**'
      - 'firmware/**'
      - 'design.md'
    tags:
      # Release tags only (YYYYMMDD_NN, optionally _test). A bare '*' meant any
      # stray tag published a draft release with all 12 SWU assets attached.
      - '20*'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# One build at a time so two quick pushes get different numbers
concurrency:
  group: auto-release
  cancel-in-progress: false

jobs:
  build:

    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Choose the release tag
      id: tag
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        if [ "$GITHUB_REF_TYPE" = tag ]; then
          echo "name=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          echo "skip=" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        # A push to master: skip when this commit already has a release tag
        # (a tag pushed together with the branch builds it on its own)
        if git ls-remote --tags origin | grep -E "^$GITHUB_SHA\s+refs/tags/20" > /dev/null; then
          echo "This commit already has a release tag, skipping"
          echo "skip=1" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        day=$(date -u +%Y%m%d)
        count=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 200 --json tagName --jq "[.[] | select(.tagName | startswith(\"${day}_\"))] | length")
        echo "name=${day}_$(printf '%02d' $((count + 1)))_test" >> "$GITHUB_OUTPUT"
        echo "skip=" >> "$GITHUB_OUTPUT"

    - name: Set up QEMU
      if: steps.tag.outputs.skip == ''
      uses: docker/setup-qemu-action@v4

    - name: Set up Docker Buildx
      if: steps.tag.outputs.skip == ''
      uses: docker/setup-buildx-action@v4

    - name: Login to GitHub Container Registry
      if: steps.tag.outputs.skip == ''
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and export
      if: steps.tag.outputs.skip == ''
      uses: docker/build-push-action@v7
      with:
        push: false
        context: .
        build-args: version=${{ steps.tag.outputs.name }}
        outputs: type=local,dest=./build/dist
        cache-from: type=registry,ref=ghcr.io/gubir34/boomslang:buildcache
        cache-to: type=registry,ref=ghcr.io/gubir34/boomslang:buildcache,mode=max,ignore-error=true

    - name: Create release
      if: steps.tag.outputs.skip == ''
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        tag: ${{ steps.tag.outputs.name }}
      # Published, not a draft: the printer's updater (touch UI and web portal)
      # reads the public releases API, which never lists drafts. Tags with
      # "_test" are published as pre-releases, which the updater only shows
      # when test versions are enabled.
      run: |
        PRERELEASE=
        case "$tag" in *_test*|*beta*) PRERELEASE=--prerelease ;; esac
        gh release create "$tag" \
            --repo="$GITHUB_REPOSITORY" \
            --target="$GITHUB_SHA" \
            --title="Boomslang ${tag}" \
            --generate-notes \
            $PRERELEASE \
            build/dist/*.swu \
            build/dist/*.zip
