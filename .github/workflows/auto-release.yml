name: Auto release on tag

# Release names are {YY}{M} {N} {Channel}, for example "2611 3 Alpha", with
# the tag 2611-3-alpha (see build/release-name.sh).
#
#   - every push to master builds the next Alpha
#   - Beta, Release Preview and Release are made by hand from master:
#       gh workflow run auto-release.yml -f channel=release
#     (or Actions > Auto release > Run workflow, and pick the channel)
#   - pushing a tag in that format builds exactly that release

on:
  workflow_dispatch:
    inputs:
      channel:
        description: "Channel of the release to build from this commit"
        required: true
        default: alpha
        type: choice
        options:
          - alpha
          - beta
          - release-preview
          - release
  push:
    # Documentation, branding and local firmware copies do not trigger one.
    branches:
      - master
    paths-ignore:
      - '**.md'
      - 'branding/**'
      - 'firmware/**'
      - 'design.md'
    tags:
      # Release tags only. A bare '*' meant any stray tag published a release
      # with all 12 SWU assets attached.
      - '[0-9][0-9]*-*-*'   # 2611-3-alpha
      - '20*'               # dated tags from before the names (20261108_04)

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# One build at a time so two quick pushes get different numbers
concurrency:
  group: auto-release
  cancel-in-progress: false

jobs:
  # Printers install releases on their own, so nothing is built or published
  # unless the tests pass
  tests:
    uses: ./.github/workflows/tests.yml

  build:
    needs: tests

    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Choose the release tag
      id: tag
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        CHANNEL: ${{ inputs.channel || 'alpha' }}
      run: |
        if [ "$GITHUB_REF_TYPE" = tag ]; then
          if ! sh build/release-name.sh check "$GITHUB_REF_NAME" && ! echo "$GITHUB_REF_NAME" | grep -Eq '^[0-9]{8}_[0-9]+'; then
            echo "$GITHUB_REF_NAME is not a release name like 2611-3-alpha" >&2
            exit 1
          fi
          # develop-test-build.yml pushes its Beta tag after making the release
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "$GITHUB_REF_NAME already has a release, skipping"
            echo "skip=1" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "name=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          echo "skip=" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        # A push to master: skip when this commit already has a release tag
        # (a tag pushed together with the branch builds it on its own). A
        # hand-started run always builds: it may promote the same commit to
        # another channel.
        if [ "$GITHUB_EVENT_NAME" = push ] &&
            git ls-remote --tags origin | grep -E "^$GITHUB_SHA\s+refs/tags/[0-9]" > /dev/null; then
          echo "This commit already has a release tag, skipping"
          echo "skip=1" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        name=$(git ls-remote --tags origin | sh build/release-name.sh next "$CHANNEL")
        echo "Next release: $name ($(sh build/release-name.sh title "$name"))"
        echo "name=$name" >> "$GITHUB_OUTPUT"
        echo "skip=" >> "$GITHUB_OUTPUT"

    - name: Set up QEMU
      if: steps.tag.outputs.skip == ''
      uses: docker/setup-qemu-action@v4

    - name: Set up Docker Buildx
      if: steps.tag.outputs.skip == ''
      uses: docker/setup-buildx-action@v4

    - name: Login to GitHub Container Registry
      if: steps.tag.outputs.skip == ''
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and export
      if: steps.tag.outputs.skip == ''
      uses: docker/build-push-action@v7
      with:
        push: false
        context: .
        build-args: version=${{ steps.tag.outputs.name }}
        outputs: type=local,dest=./build/dist
        cache-from: type=registry,ref=ghcr.io/gubir34/boomslang:buildcache
        cache-to: type=registry,ref=ghcr.io/gubir34/boomslang:buildcache,mode=max,ignore-error=true

    - uses: actions/setup-go@v6
      if: steps.tag.outputs.skip == ''
      with:
        go-version-file: tools/usb-installer/go.mod
        cache: false

    # The tool that puts a release on a USB drive (tools/usb-installer),
    # attached to every release for Windows and Linux
    - name: Build the USB installer
      if: steps.tag.outputs.skip == ''
      working-directory: tools/usb-installer
      env:
        CGO_ENABLED: '0'
      run: |
        flags="-s -w -X main.version=${{ steps.tag.outputs.name }}"
        GOOS=windows GOARCH=amd64 go build -trimpath -ldflags "$flags" -o ../../build/dist/boomslang-usb-windows-x64.exe .
        GOOS=linux GOARCH=amd64 go build -trimpath -ldflags "$flags" -o ../../build/dist/boomslang-usb-linux-x64 .
        GOOS=linux GOARCH=arm64 go build -trimpath -ldflags "$flags" -o ../../build/dist/boomslang-usb-linux-arm64 .
        ls -l ../../build/dist/boomslang-usb-*

    - name: Check the update packages
      if: steps.tag.outputs.skip == ''
      run: sh build/smoke-test-swu.sh build/dist "${{ steps.tag.outputs.name }}"

    - name: Create release
      if: steps.tag.outputs.skip == ''
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        tag: ${{ steps.tag.outputs.name }}
      # Published, not a draft: the printer's updater (touch UI and web portal)
      # reads the public releases API, which never lists drafts. Alpha, Beta
      # and Release Preview are published as pre-releases, which the updater
      # only offers when test versions or that channel are enabled.
      run: |
        PRERELEASE=
        if sh build/release-name.sh prerelease "$tag"; then PRERELEASE=--prerelease; fi
        gh release create "$tag" \
            --repo="$GITHUB_REPOSITORY" \
            --target="$GITHUB_SHA" \
            --title="Boomslang $(sh build/release-name.sh title "$tag")" \
            --generate-notes \
            $PRERELEASE \
            build/dist/*.swu \
            build/dist/*.zip \
            build/dist/boomslang-usb-*
